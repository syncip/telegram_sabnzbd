# Alle Einstellungen stehen hier direkt. Leere Werte ("") = Standard bzw. nicht genutzt.
# ACHTUNG: Nach dem Eintragen der Keys diese Datei nicht mehr committen/pushen.

services:
  arrbot:
    # Fertiges Image von GitHub (wird bei jedem Push automatisch gebaut, amd64 und arm64).
    # "always" holt bei jedem "up" die neueste Version; feste Version z. B. ":1.8.1".
    image: ghcr.io/syncip/telegram_sabnzbd:latest
    pull_policy: always
    # Stattdessen selbst bauen (aus dem geklonten Repo): die zwei Zeilen oben auskommentieren und
    # build: .
    # pull_policy: build
    container_name: arrbot
    restart: unless-stopped
    volumes:
      - ./data:/data
      # Optional für 🎧 „Reinhören“ (prüft die gesprochene Sprache): deine Medien-Ordner, nur lesend.
      # Unraid z. B.:
      # - /mnt/user/media:/media:ro
    environment:
      # Benutzer/Gruppe, dem der Daten-Ordner gehört. Unraid: 99 / 100 (nobody:users).
      # Andere Linux-Server meist 1000 / 1000 (Ausgabe von "id" auf dem Server).
      PUID: "99"
      PGID: "100"

      # --- Telegram ---------------------------------------------------------
      # Token von @BotFather
      TELEGRAM_BOT_TOKEN: ""
      # Deine Telegram-ID (z. B. über @userinfobot). Du bist Admin: du gibst andere Nutzer
      # im Bot per Button frei, sperrst sie und setzt Limits (/nutzer, /limit).
      ADMIN_USER_ID: ""
      # Optional: weitere Nutzer, die sofort freigeschaltet sind, kommagetrennt ("12345,67890").
      # Alle anderen, die dem Bot schreiben, landen als Anfrage bei dir.
      ALLOWED_USER_IDS: ""

      # --- Sprach-KI ---------------------------------------------------------
      # gemini | anthropic | openai  (openai = alles OpenAI-kompatible: OpenAI, OpenRouter, Groq, Ollama ...)
      LLM_PROVIDER: "gemini"
      # Key des gewählten Anbieters. Gemini: https://aistudio.google.com/apikey
      LLM_API_KEY: ""
      # Leer = Standard: gemini-flash-latest / claude-opus-5-5 / gpt-6-luna
      # (gpt-4o-mini und gpt-4.1 schaltet OpenAI am 14.01.2027 ab – nicht mehr eintragen)
      LLM_MODEL: ""
      # Nur OpenAI: wie viel das Modell vor der Antwort nachdenkt: none | low | medium | high
      # (Leer = low. Kennt ein Modell das nicht, lässt der Bot es automatisch weg.)
      LLM_REASONING: ""
      # Nur für OpenAI-kompatible Server, z. B. http://ollama:11434/v1 oder https://openrouter.ai/api/v1
      LLM_BASE_URL: ""

      # --- Radarr (leer lassen, wenn nicht genutzt) ---------------------------
      RADARR_URL: "http://radarr:7878"
      # Radarr -> Settings -> General -> API Key
      RADARR_API_KEY: ""
      # Leer = erster Root-Ordner in Radarr
      RADARR_ROOT_FOLDER: ""
      # Standard-Qualitätsprofil, exakt wie in Radarr benannt (Groß/klein egal), z. B. "1080p german".
      # Wird genommen, wenn bei der Nachfrage nichts gewählt wird. Leer = erstes Profil in Radarr.
      RADARR_QUALITY_PROFILE: ""
      # announced | inCinemas | released
      RADARR_MINIMUM_AVAILABILITY: "released"

      # --- Sonarr (leer lassen, wenn nicht genutzt) ---------------------------
      SONARR_URL: "http://sonarr:8989"
      SONARR_API_KEY: ""
      SONARR_ROOT_FOLDER: ""
      # Standard-Qualitätsprofil in Sonarr (wie bei Radarr)
      SONARR_QUALITY_PROFILE: ""

      # --- SABnzbd (optional): Fortschritt, Geschwindigkeit, Fertig-Uhrzeit --------
      # Leer lassen, wenn nicht genutzt.
      SABNZBD_URL: "http://sabnzbd:8080"
      # SABnzbd -> Config -> General -> API Key
      SABNZBD_API_KEY: ""

      # --- TMDB (optional, kostenlos): deutsche Titel, deutsche Termine, Vorschläge, Top-Listen ---
      # themoviedb.org -> Einstellungen -> API: "API-Schlüssel" oder "Lesezugriffs-Token"
      TMDB_API_KEY: ""

      # --- Plex (optional): verbinden macht jeder selbst im Bot mit /plex (Code auf plex.tv/link) ---
      # Lokale Adresse des Plex-Servers, falls der Bot ihn sonst nicht findet. Leer = automatisch.
      PLEX_URL: ""

      # --- Mediathek ---
      # Admins bekommen eine Warnung, wenn weniger als so viele GB frei sind ("0" = aus)
      DISK_WARN_GB: "50"
      # /mediathek: "lange da, nie geschaut" ab so vielen Tagen
      UNWATCHED_DAYS: "180"
      # 🎧 Reinhören: Pfade, wie Sonarr/Radarr sie sehen = Pfade im Bot-Container (oben eingebunden).
      # Z. B. "/tv=/media/tv;/movies=/media/movies". Leer = gleiche Pfade.
      MEDIA_PATHS: ""
      # 🎧 Reinhören: OpenAI-Key für die Spracherkennung (ca. 0,2 Cent pro 20-s-Ausschnitt).
      # Leer = der KI-Key, falls LLM_PROVIDER openai ist.
      LISTEN_API_KEY: ""

      # --- Überwachung & Updates ---
      # Radarr, Sonarr, SABnzbd, TMDB und Plex so oft prüfen; Admins hören bei Ausfall und Rückkehr ("0" = aus)
      MONITOR_MINUTES: "5"
      # Einmal täglich nachsehen, ob es eine neue Bot-Version auf GitHub gibt ("" = aus)
      UPDATE_REPO: "syncip/telegram_sabnzbd"
      # Nur bei privatem Repo: GitHub-Token mit Leserecht ("Fine-grained", Repository -> Contents: Read-only)
      UPDATE_TOKEN: ""
      # Beobachtete Webseiten so oft prüfen (Stunden, "0" = aus)
      SITE_CHECK_HOURS: "6"
      # Spam-Schutz: Flut-Nachrichten -> vorsorglich sperren, Übertreibung -> Warnung ("0" = aus)
      SPAM_CHECK: "1"
      # Modell, das neue Werkzeuge (Rezepte) für den Admin baut ("" = gpt-6.1-terra bei OpenAI, sonst LLM_MODEL)
      RECIPE_MODEL: ""
      # Nachdenken beim Werkzeugbau: none | low | medium | high ("" = low)
      RECIPE_REASONING: ""

      # Zeitzone für "fertig ca. 21:45 Uhr"
      TZ: "Europe/Berlin"

      # --- Verhalten ----------------------------------------------------------
      # Nennst du keine Qualität, zeigt der Bot Buttons mit allen Profilen und nimmt nach
      # so vielen Sekunden ohne Auswahl das Standardprofil. "0" = nie fragen, sofort Standard.
      QUALITY_PROMPT_SECONDS: "60"
      # Wie oft Radarr/Sonarr nach neuen Ereignissen gefragt werden (Sekunden)
      POLL_INTERVAL_SECONDS: "60"
      # Nach so vielen Minuten ohne gefundenen Download EINMAL Bescheid geben (mit Buttons
      # „In 3/7 Tagen nochmal“ und „Löschen“). Danach still weitersuchen. "0" = nie melden.
      NO_RELEASE_NOTICE_MINUTES: "30"
      # So lange werden Serien nach der letzten Aktivität weiter beobachtet (Tage)
      TRACK_DAYS: "30"
      # Nach so vielen Minuten Pause beginnt ein neues Gespräch
      CONVERSATION_IDLE_MINUTES: "10"
      LOG_LEVEL: "INFO"

    # Laufen Radarr/Sonarr in einem anderen Compose-Projekt, das gemeinsame Netzwerk
    # hier eintragen und oben die Containernamen als URL nutzen (http://radarr:7878).
    # Sonst die LAN-IP des Servers verwenden, z. B. http://192.168.1.10:7878.
    # networks:
    #   - media

# networks:
#   media:
#     external: true
